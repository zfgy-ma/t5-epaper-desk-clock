; 桌面时钟固件 —— PlatformIO 工程配置
; 硬件：ESP32 + 2.13 英寸墨水屏（122×250，SSD1675B 兼容，如 HINK-E0213A22）
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = COM3

; 使用 3MB 应用分区（中文字体库较大，默认 1.25MB 分区不够用）
board_build.partitions = huge_app.csv

lib_deps =
    ; 墨水屏驱动库（GPL-3.0）
    https://github.com/ZinggJM/GxEPD2.git
    ; u8g2 字体渲染（中文）桥接到 Adafruit GFX
    olikraus/U8g2_for_Adafruit_GFX
    ; JSON 解析（config.json 与天气接口数据）
    bblanchon/ArduinoJson

; 把 config.json 编译进固件（该文件不提交到 git，仅本机存在）
board_build.embed_files = config.json

; 编译前确保 config.json 存在（缺失时从示例复制）
extra_scripts = pre:scripts/ensure_config.py
